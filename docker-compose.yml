services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile

    ports:
      - "4000:4000"

    volumes:
      - sqlite_data:/app/data

    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile

    ports:
      - "8080:80"

    depends_on:
      - server

    restart: unless-stopped

volumes:
  sqlite_data: