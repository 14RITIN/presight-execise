services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile

    ports:
      - "4000:4000"

    volumes:
      - sqlite_data:/app/data

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/api/health').then(async response => { if (!response.ok || (await response.json()).status !== 'ok') process.exit(1); }).catch(() => process.exit(1));"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile

    ports:
      - "8080:80"

    depends_on:
      server:
        condition: service_healthy

    restart: unless-stopped

volumes:
  sqlite_data:
